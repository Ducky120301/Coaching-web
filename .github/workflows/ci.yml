name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json
      - run: dotnet tool restore
        working-directory: backend
      - run: dotnet build Coaching.slnx
        working-directory: backend
      - run: dotnet test Coaching.slnx --no-build --filter "Category!=web&Category!=manual"
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build:all
      - run: npm run test:ci

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start stack
        run: |
          cp deploy/.env.example deploy/.env
          sed -i 's/^AUTH_PERMIT_PER_MINUTE=.*/AUTH_PERMIT_PER_MINUTE=1000/' deploy/.env
          docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build --wait
          healthy=false
          for _ in $(seq 1 40); do
            if curl -fs http://localhost:4200/health; then healthy=true; break; fi
            sleep 3
          done
          if [ "$healthy" != true ]; then echo "API không healthy sau 120s"; exit 1; fi
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run e2e
        working-directory: frontend
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports
          path: frontend/e2e/reports
      - if: failure()
        run: docker compose -f deploy/docker-compose.yml --env-file deploy/.env logs db liquibase api web

  # @ADR-f00-codebase-012: secret environment staging giống Healthy app (DB_JDBC_URL/DB_USERNAME/DB_PASSWORD)
  db-migrate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [backend, frontend, e2e]
    timeout-minutes: 15
    environment: staging
    concurrency:
      group: db-migrate-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        env:
          DB_JDBC_URL: ${{ secrets.DB_JDBC_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          for v in DB_JDBC_URL DB_USERNAME DB_PASSWORD; do
            test -n "${!v}" || { echo "::error::Missing secret $v in environment staging"; exit 1; }
          done
      - name: liquibase validate, update-sql, update, history
        env:
          LIQUIBASE_COMMAND_URL: ${{ secrets.DB_JDBC_URL }}
          LIQUIBASE_COMMAND_USERNAME: ${{ secrets.DB_USERNAME }}
          LIQUIBASE_COMMAND_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          set -euo pipefail
          lb() {
            docker run --rm -v "$PWD/database/changelog:/liquibase/changelog:ro" \
              -e LIQUIBASE_COMMAND_URL -e LIQUIBASE_COMMAND_USERNAME -e LIQUIBASE_COMMAND_PASSWORD \
              liquibase/liquibase:4.33.0 --search-path=/liquibase/changelog --changelog-file=db.changelog-master.xml "$@"
          }
          lb validate
          lb update-sql
          lb update
          lb history

  # @ADR-f00-codebase-012: Render chỉ chạy image đã qua test
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Compute image name
        id: meta
        run: |
          base="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/coaching-web-api"
          echo "image=${base}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "latest=${base}:latest" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # @ADR-f00-codebase-012: deploy hook Render sau khi image + DB staging sẵn sàng
  deploy-staging:
    needs: [publish, db-migrate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - name: Trigger Render deploy (API)
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_API }}
          IMAGE: ${{ needs.publish.outputs.image }}
        run: |
          test -n "$HOOK" || { echo "::error::Missing secret RENDER_DEPLOY_HOOK_API"; exit 1; }
          curl -fsS -X POST "${HOOK}&imgURL=${IMAGE}" -o /dev/null
          echo "Triggered Render deploy for ${IMAGE}"
      - name: Smoke test /health
        env:
          BASE_URL: ${{ vars.STAGING_API_URL }}
        run: |
          if [ -z "$BASE_URL" ]; then
            echo "::warning::Variable STAGING_API_URL is not set in environment staging; skipping smoke test"
            exit 0
          fi
          url="${BASE_URL%/}/health"
          sleep 30
          for _ in $(seq 1 24); do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$url" || true)"
            echo "GET $url -> $code"
            if [ "$code" = "200" ]; then echo "Service is ready"; exit 0; fi
            sleep 15
          done
          echo "::error::Service did not become ready within the timeout"
          exit 1
      - name: Trigger Render deploy (static sites)
        env:
          HOOK_ADMIN: ${{ secrets.RENDER_DEPLOY_HOOK_ADMIN }}
          HOOK_CLIENT: ${{ secrets.RENDER_DEPLOY_HOOK_CLIENT }}
        run: |
          for v in HOOK_ADMIN HOOK_CLIENT; do
            test -n "${!v}" || { echo "::error::Missing secret RENDER_DEPLOY_HOOK_${v#HOOK_}"; exit 1; }
            curl -fsS -X POST "${!v}" -o /dev/null
          done
          echo "Triggered Render deploy for admin + client"
